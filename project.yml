name: HoverWord
options:
  bundleIdPrefix: com.hoverword
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  HoverWord:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Features
      - path: Models
      - path: Services
      - path: Shared
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.hoverword.app
        PRODUCT_NAME: HoverWord
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: "YES"
        ARCHS: "$(ARCHS_STANDARD)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 允许测试 target 访问内部类型
        OTHER_SWIFT_FLAGS: "$(inherited) -enable-testing"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: HoverWord
        CFBundleDisplayName: HoverWord
        CFBundleIdentifier: com.hoverword.app
        # 版本号走构建变量注入（唯一真源为上方 MARKETING_VERSION / CURRENT_PROJECT_VERSION），
        # 不要在 Xcode 或此处写死数值——xcodegen regen 会覆盖 Xcode 里的手动修改
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundlePackageType: APPL
        CFBundleExecutable: HoverWord
        LSUIElement: false
        NSHumanReadableCopyright: "Copyright © 2026 Richops. All rights reserved."
        NSPrincipalClass: NSApplication

  HoverWordTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HoverWordTests
    dependencies:
      - target: HoverWord
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoverword.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HoverWord.app/Contents/MacOS/HoverWord"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
